name: Go Dependency Vulnerability Scan

on:
  workflow_call:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Points the caching mechanism to your backend folder
          cache-dependency-path: backend/go.sum

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          # Tells the action to look inside your backend directory
          work-dir: backend