name: Go Dependency Vulnerability Scan

on:
  workflow_call:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # Points the caching mechanism to your backend folder
          cache-dependency-path: backend/go.sum
      
      - name: Install govulncheck binary
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        continue-on-error: true        
        env:
          GOTOOLCHAIN: local
        run: govulncheck -C backend ./...

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20' # Change this to your required Node version
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run npm audit
        working-directory: frontend
        run: npm audit fix --legacy-peer-deps || true