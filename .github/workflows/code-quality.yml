name: code-quality

on:
  workflow_call:

jobs:
  frontend-qa:
    runs_on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Changes directory for all steps

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm' # Caches dependencies automatically
          cache-dependency-path: ./frontend/package-lock.json

      - name: install dependencies
        run: npm install --legacy-peer-deps

      - name: run linter
        run: npm run lint

      - name: run tests
        run: npm test

  backend-qa:
    runs_on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: ./backend/go.sum

      - name: run linter
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ./backend

      - name: run tests
        run: go test -v ./...
