name : Docker scan

on:
  workflow_call:

jobs:
  dockerscan:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        folders: [frontend, backend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Lint Dockerfile for ${{matrix.folders}}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{matrix.folders}}/Dockerfile

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      # # --- BUILD STEP ---
      # # Build images locally and load them into the Docker daemon
      # - name: Build Backend Local Image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./backend
      #     file: ./backend/Dockerfile
      #     load: true # Crucial: exports the image to the local Docker daemon
      #     tags: dev-backend:latest

      # # --- SCAN STEP ---
      # # Changes scan-type to 'image' and scans the built local container
      # - name: Scan Backend Docker Image
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     scan-type: 'image'
      #     image-ref: 'dev-backend:latest'
      #     format: 'table'
      #     severity: 'CRITICAL,HIGH'
      #     exit-code: '1' # Fails the pipeline if vulnerabilities exist

      # --- BUILD STEP ---
      - name: Build Frontend Local Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: dev-frontend:latest

      # --- SCAN STEP ---
      - name: Scan Frontend Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'dev-frontend:latest'
          format: 'table'
          severity: 'HIGH'
          exit-code: '1'          